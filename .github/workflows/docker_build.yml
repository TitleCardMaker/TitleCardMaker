name: multi-build-docker
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      addl_tag:
        required: false
        type: string
      is_develop:
        required: false
        type: boolean
        default: false
      publish_semver_aliases:
        required: false
        type: boolean
        default: false
    secrets:
      CYPRESS_RECORD_KEY:
        required: true
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_ACCESS_TOKEN:
        required: true
      GH_TOKEN:
        required: true

env:
  DOCKER_IMGNAME: ghcr.io/titlecardmaker/titlecardmaker

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch:
          - linux/amd64
          # - linux/arm/v7
          - linux/arm64

    # Set dockerfile to .armv7 if arch is arm/v7
    env:
      DOCKERFILE: ${{ matrix.arch == 'linux/arm/v7' && 'Dockerfile.armv7' || 'Dockerfile' }}
      IMAGE_NAME: ''

    steps:
      # Pre-setup
      - name: Set IMAGE_NAME
        run: echo "IMAGE_NAME=$(echo ${{ matrix.arch }} | cut -b 7- | tr -d '/')" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Docker build environment
      - name: Set up QEMU for ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: python3 build cache for docker
        uses: actions/cache@v4
        with:
          path: python-build-cache
          key: ${{ matrix.arch }}-python-build-cache

      - name: inject python-build-cache into docker
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "python-build-cache" : "/root/.cache"
            }

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ matrix.arch }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ matrix.arch }}-buildx-

      # Build container
      - name: Build Container
        uses: docker/build-push-action@v5
        with:
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.arch }}
          push: false
          tags: ${{ env.DOCKER_IMGNAME }}:${{ inputs.tag }}-${{ env.IMAGE_NAME }}
          build-args: |
            TCM_IS_DEVELOP=${{ inputs.is_develop == true && 'TRUE' || 'FALSE' }}
          outputs: type=docker,dest=/tmp/${{ env.IMAGE_NAME }}.tar
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - # Build cache temp fix
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
        name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # Upload artifacts for later steps
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-image
          path: /tmp/${{ env.IMAGE_NAME }}.tar
          retention-days: 1

  test:
    runs-on: ubuntu-24.04
    needs: build
    defaults:
      run:
        working-directory: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Set up Cypress test environment
      - name: Install Cypress Dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev
          libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb

      - name: Download amd64-image
        uses: actions/download-artifact@v4
        with:
          name: amd64-image
          path: /tmp

      - name: Load image
        run: |
          docker load --input /tmp/amd64.tar
          docker image ls -a

      - name: Launch Container
        run: |
          mkdir config
          docker run -itd -p 4242:4242 -e TCM_TESTING=TRUE -v "./config":"/config" "${{ env.DOCKER_IMGNAME }}:${{ inputs.tag }}-amd64"

      - name: Start virtual display (Xvfb)
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &

      - name: Run Cypress Tests
        run: |
          npm install
          npm run cy:run:report
        env:
          DISPLAY: :99
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

      # Parse testing pass percentage
      - name: Parse Test Results
        id: pass-percentage
        run: |
          npx mochawesome-merge ./cypress/results/*.json > ./cypress/results/output.json
          echo $(jq '.stats.passPercent' './cypress/results/output.json')
          echo "PASS_PERCENTAGE=$(jq '.stats.passPercent' './cypress/results/output.json')" >> $GITHUB_OUTPUT

      # Upload test artifacts
      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: tests/cypress/screenshots/
          retention-days: 1

      - name: Error if not enough tests passed
        if: ${{ fromJSON(steps.pass-percentage.outputs.PASS_PERCENTAGE) <= 80 }}
        run: exit 1

  push:
    runs-on: ubuntu-24.04
    needs: [build, test]
    env:
      DOCKER_HUB_IMGNAME: ${{ secrets.DOCKER_HUB_USERNAME }}/titlecardmaker
    steps:
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          pattern: "*-image"
          merge-multiple: true
          path: /tmp

      - name: Docker image tag updates
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMGNAME }}
          tags: |
            ${{ inputs.tag }}

      - name: Load docker images
        run: |
          docker load --input /tmp/amd64.tar
          docker load --input /tmp/arm64.tar
          docker image ls -a

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      # Push images to add to manifest
      # Do not pull from these tags, use the generic label - e.g. "latest" and
      # allow Docker to grab the correct architecture. These are build artifacts
      - name: Push imported images
        run: |
          docker push ${{ steps.meta.outputs.tags }}-amd64
          docker push ${{ steps.meta.outputs.tags }}-arm64

      # Create mutli-arch manifest https://docs.docker.com/reference/cli/docker/manifest/
      - name: Create manifest list and push
        run: |
          docker manifest create ${{ steps.meta.outputs.tags }} \
          ${{ steps.meta.outputs.tags }}-amd64 \
          ${{ steps.meta.outputs.tags }}-arm64
          docker manifest push ${{ steps.meta.outputs.tags }}

      # Publish the multi-arch image (and optional aliases) to Docker Hub and GHCR
      - uses: sigstore/cosign-installer@v3.5.0
        if: ${{ inputs.addl_tag || inputs.publish_semver_aliases }}
      - name: Install regctl
        uses: iarekylew00t/regctl-installer@61b6298c354562a692195ea71441e58508e667b0
      - name: regctl login
        run: |
          regctl registry login ghcr.io -u ${{ github.repository_owner }} -p ${{ secrets.GH_TOKEN }}
          echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | \
            regctl registry login -u ${{ secrets.DOCKER_HUB_USERNAME }} --pass-stdin
      - name: Publish to Docker Hub
        run: |
          regctl image copy ${{ steps.meta.outputs.tags }} \
            ${{ env.DOCKER_HUB_IMGNAME }}:${{ inputs.tag }}
      - name: regctl copy to new tag
        if: ${{ inputs.addl_tag }}
        run: |
          regctl image copy ${{ steps.meta.outputs.tags }} \
            ${{ env.DOCKER_IMGNAME }}:${{ inputs.addl_tag }}
          regctl image copy ${{ steps.meta.outputs.tags }} \
            ${{ env.DOCKER_HUB_IMGNAME }}:${{ inputs.addl_tag }}

      # Also publish vMAJOR.MINOR and vMAJOR aliases for semver releases
      - name: Publish semver alias tags
        if: ${{ inputs.publish_semver_aliases }}
        run: |
          TAG="${{ inputs.tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not vMAJOR.MINOR.PATCH; skipping aliases"
            exit 0
          fi
          MAJOR_MINOR="${TAG%.*}"
          MAJOR="${TAG%%.*}"
          for dest in \
            "${{ env.DOCKER_IMGNAME }}:${MAJOR_MINOR}" \
            "${{ env.DOCKER_IMGNAME }}:${MAJOR}" \
            "${{ env.DOCKER_HUB_IMGNAME }}:${MAJOR_MINOR}" \
            "${{ env.DOCKER_HUB_IMGNAME }}:${MAJOR}"
          do
            regctl image copy "${{ steps.meta.outputs.tags }}" "${dest}"
          done

      # Delete untagged images
      - name: Delete untagged images
        uses: Chizkiyahu/delete-untagged-ghcr-action@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          untagged_only: true
          except_untagged_multiplatform: false
          owner_type: org
