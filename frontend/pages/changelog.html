<!DOCTYPE html>
<html lang="en">

<head>
  <title>Changelog - TitleCardMaker</title>
  {% include "/pages/html_boilerplate.html" %}

  <script type="text/javascript">
    {% include "/js/changelogData.js" %}
    {% include "/js/changelog.js" %}
  </script>

  <link rel="stylesheet" type="text/css" href="/css/changelog.css?v={{preferences.config.CURRENT_VERSION}}"/>
</head>

<body onload="initializePage();" style="background-image: var(--background);">
  <div class="pusher">
    <div id="page-header">
      {% include "/pages/header.html" %}
    </div>
    <div id="nav-menu">
      {% include "/pages/system_sidebar.html" %}
    </div>

    <div id="main-content" class="article">
      <div class="settings-panel" id="changelog">
        <div class="settings-panel-header">
          <i class="book icon"></i>
          Release Notes
          <div class="changelog-nav" aria-label="Version navigation">
            <button type="button" id="changelog-prev" class="changelog-nav-btn" title="Newer release" aria-label="Newer release">
              <i class="chevron left icon"></i>
            </button>
            <label class="changelog-version-label" for="changelog-version-select">Version</label>
            <select id="changelog-version-select" class="changelog-version-select" aria-label="Select release version"></select>
            <button type="button" id="changelog-next" class="changelog-nav-btn" title="Older release" aria-label="Older release">
              <i class="chevron right icon"></i>
            </button>
          </div>
        </div>
        <section>
          <div id="changelog-release" class="changelog-release"></div>
        </section>
      </div>
    </div>
  </div>
</body>
</html>
