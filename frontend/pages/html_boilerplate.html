<meta charset="UTF-8">

<!-- Prevent theme flash: Apply theme immediately before page renders -->
<script>
  (function() {
    try {
      const isDark = (localStorage.getItem('site-theme') || 'dark') === 'dark';

      // Apply theme immediately using inline styles (before CSS loads)
      if (isDark) {
        document.documentElement.style.setProperty('--background', 'linear-gradient(to bottom right, rgb(29,29,29), rgb(40,40,40))');

        // Update theme-color meta tag for mobile browsers
        let themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (themeColorMeta) {
          themeColorMeta.content = '#1b1c1d';
        }
      } else {
        document.documentElement.style.setProperty('--background', 'linear-gradient(to bottom right, #f5f7fa, #d9d9d9)');

        // Update theme-color meta tag for mobile browsers
        let themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (themeColorMeta) {
          themeColorMeta.content = '#f5f7fa';
        }
      }
    } catch(e) {
      // Fallback to dark theme if localStorage fails
      document.body.style.backgroundImage = 'linear-gradient(to bottom right, rgb(29,29,29), rgb(40,40,40))';
      document.body.className = 'dark';
    }
  })();
</script>

<script type="text/javascript">
  $(document).ready(function() {
    // Error icon if a Connection is invalid
    {% if preferences.invalid_connections %}
      if ($('#nav-menu a[href="/connections"]').length > 0) {
        $('#nav-menu a[href="/connections"] i').toggleClass('red', true);
      } else {
        $('#nav-menu a[href="/settings"] i').toggleClass('red', true);
      }
    {% endif %}

    // Turn on accessible colormode if enabled
    {% if preferences.colorblind_mode %}
      $('body').toggleClass('accessible', true);
    {% endif %}

    // Update link for this page's external documentation link
    let docSite = '';
    if      (location.pathname === '/') { }
    else if (location.pathname.startsWith('/series')) { docSite = 'user_guide/series/'; }
    else if (location.pathname === '/add')            { docSite = 'user_guide/new_series'; }
    else if (location.pathname === '/card-templates') { docSite = 'user_guide/templates'; }
    else if (location.pathname === '/fonts')          { docSite = 'user_guide/fonts'; }
    else if (location.pathname === '/sync')           { docSite = 'user_guide/syncs'; }
    else if (location.pathname === '/settings')       { docSite = 'user_guide/settings/'; }
    else if (location.pathname === '/system')         { docSite = 'user_guide/system/'; }
    else if (location.pathname.startsWith('/graphs')) { }
    else if (location.pathname === '/connections')    { docSite = 'user_guide/connections/'; }
    else if (location.pathname === '/scheduler')      { }
    else if (location.pathname === '/import')         { }
    else if (location.pathname === '/logs')           { docSite = 'user_guide/logs/' }
    document.getElementById('documentation-link').href = `https://titlecardmaker.com/${docSite}`;
  });
</script>
