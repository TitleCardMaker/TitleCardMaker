<!DOCTYPE html>
<html lang="en">

<head>
  <title>Login - TitleCardMaker</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/internal_assets/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/internal_assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/internal_assets/favicon/favicon-16x16.png">
  <link rel="manifest" href="/internal_assets/favicon/site.webmanifest">

  <!-- Formantic UI -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.min.js"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.2/dist/semantic.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.2/dist/semantic.min.js"></script>

  <script type="text/javascript" defer>
    {% include "/js/login.js" %}
  </script>

  <link rel="stylesheet" type="text/css" href="/css/login.css?v={{ current_version }}"/>
</head>

<body>
  <div class="pusher">
    <div id="login">
      <img src="/public/tcm_no_lettering.svg">
      <p class="app-name">TitleCardMaker</p>

      <div class="ui elastic inverted segment">

        {% if temporary_credentials %}
          <div class="ui center aligned info message">
            <div class="header">Temporary Credentials</div>
            <p>A temporary username and password have been<br>created for you.</p>
            <p>Please change these after logging in.</p>
            <p>Username: <strong>admin</strong><br>Password: <strong>password</strong></p>
          </div>
        {% endif %}

        <form id="login-form">
          <div class="text field">
            <div class="ui left icon input">
              <i class="user icon"></i>
              <input id="username" type="text" required="" autofocus tabindex="0" name="username">
              <label>Username</label>
            </div>
          </div>

          <div class="text field">
            <div class="ui left icon input">
              <i class="lock icon"></i>
              <input id="password" type="password" required="" tabindex="0" name="password">
              <label>Password</label>
            </div>
          </div>

          <button id="login-btn" type="button" onclick="submitForm();">
            Login
          </button>
        </form>

        <a class="forgot" href="https://titlecardmaker.com/user_guide/connections/#forgotten-login" target="_blank">Forgot Password?</a>
      </div>
    </div>
  </div>
</body>
</html>
