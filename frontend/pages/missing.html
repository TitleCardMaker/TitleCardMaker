<!DOCTYPE html>
<html lang="en">

<head>
  <title>Missing - TitleCardMaker</title>
  {% include "/pages/html_boilerplate.html" %}

  <script type="text/javascript">
    {% include "/js/missing.js" %}
  </script>

  <link rel="stylesheet" type="text/css" href="/css/missing.css?v={{preferences.config.CURRENT_VERSION}}"/>

  <!-- ── Missing Title Cards ───────────────────────────────────────────── -->

  <!-- Series row (poster · name · count badge · expand button) -->
  <template id="missing-card-template">
    <div class="missing-series-row">
      <div class="missing-series-header">
        <img class="missing-series-poster" onerror="this.onerror=null; this.src='/internal_assets/placeholder.jpg'">
        <div class="missing-series-name" data-value="name"></div>
        <span class="missing-count-badge" data-row="count"></span>
        <button class="missing-expand-btn" data-action="expand" type="button">
          <i class="chevron down icon"></i>
        </button>
      </div>
      <div class="missing-episodes-panel" data-row="detail" style="display: none;">
        <div class="missing-episode-list" data-row="episodes-container"></div>
      </div>
    </div>
  </template>

  <!-- Individual episode pill inside the expanded row -->
  <template id="missing-episode-template">
    <div class="missing-episode-pill">
      <span class="missing-episode-code" data-row="episode-info"></span>
      <span class="missing-episode-title" data-row="episode-title"></span>
    </div>
  </template>

  <!-- ── Missing Logos ─────────────────────────────────────────────────── -->

  <template id="missing-logo-template">
    <a class="missing-logo-item">
      <img class="missing-series-poster" onerror="this.onerror=null; this.src='/internal_assets/placeholder.jpg'">
      <div class="missing-logo-name" data-value="name"></div>
      <span class="missing-logo-file" data-row="filename">logo.png</span>
    </a>
  </template>

  <!-- ── Unloaded Cards ────────────────────────────────────────────────── -->

  <!-- Series row (poster · name · count badge · load button · expand button) -->
  <template id="unloaded-card-template">
    <div class="missing-series-row">
      <div class="missing-series-header">
        <img class="missing-series-poster" onerror="this.onerror=null; this.src='/internal_assets/placeholder.jpg'">
        <div class="missing-series-name" data-value="name"></div>
        <span class="missing-count-badge" data-row="count"></span>
        <button class="missing-load-btn" data-action="load" type="button">
          <i class="upload icon"></i>
          Load
        </button>
        <button class="missing-expand-btn" data-action="expand" type="button">
          <i class="chevron down icon"></i>
        </button>
      </div>
      <div class="missing-cards-panel" data-row="detail" style="display: none;">
        <div class="missing-card-grid" data-row="cards-container"></div>
      </div>
    </div>
  </template>

  <!-- Individual card thumbnail inside the expanded unloaded-cards row -->
  <template id="unloaded-card-image-template">
    <div class="missing-card-thumb">
      <img loading="lazy">
      <div class="missing-card-label" data-row="episode-info"></div>
    </div>
  </template>

</head>

<body onload="initAll();" style="background-image: var(--background);">
  <div class="pusher">
    <div id="page-header">
      {% include "/pages/header.html" %}
    </div>
    <div id="nav-menu">
      {% include "/pages/home_sidebar.html" %}
    </div>

    <div id="main-content" class="article">

      <!-- ── Missing Title Cards panel ─────────────────────────────────── -->
      <div class="settings-panel missing-panel">
        <div class="settings-panel-header">
          <i class="film icon"></i>
          Missing Title Cards
          <span class="missing-header-badge" id="missing-cards-header-count" style="display: none;"></span>
          <div class="missing-filter-controls">
            <span class="pill-filter-label">per page</span>
            <div class="pill-filter-group" id="missing-cards-size-filter">
              <button class="pill-filter-btn" data-value="50" onclick="setMissingCardsPageSize(50)" type="button">50</button>
              <button class="pill-filter-btn active" data-value="100" onclick="setMissingCardsPageSize(100)" type="button">100</button>
              <button class="pill-filter-btn" data-value="200" onclick="setMissingCardsPageSize(200)" type="button">200</button>
            </div>
            <button class="missing-refresh-btn" onclick="queryMissingCards()" title="Refresh" type="button">
              <i class="redo icon"></i>
            </button>
          </div>
        </div>
        <section>
          <div id="missing-cards-list">
            <div class="missing-loading-state">
              <i class="spinner loading icon"></i>
              Loading…
            </div>
          </div>
          <div id="card-pagination" class="ui centered pagination menu"></div>
        </section>
      </div>

      <!-- ── Missing Logos panel ────────────────────────────────────────── -->
      <div class="settings-panel missing-panel">
        <div class="settings-panel-header">
          <i class="image outline icon"></i>
          Missing Logos
          <span class="missing-header-badge" id="missing-logos-header-count" style="display: none;"></span>
        </div>
        <section>
          <div id="missing-logos-list" class="missing-logos-list">
            <div class="missing-loading-state">
              <i class="spinner loading icon"></i>
              Loading…
            </div>
          </div>
        </section>
      </div>

      <!-- ── Unloaded Cards panel ───────────────────────────────────────── -->
      <div class="settings-panel missing-panel">
        <div class="settings-panel-header">
          <i class="cloud upload icon"></i>
          Unloaded Cards
          <span class="missing-header-badge" id="unloaded-cards-header-count" style="display: none;"></span>
          <div class="missing-filter-controls">
            <span class="pill-filter-label">per page</span>
            <div class="pill-filter-group" id="unloaded-cards-size-filter">
              <button class="pill-filter-btn" data-value="50" onclick="setUnloadedCardsPageSize(50)" type="button">50</button>
              <button class="pill-filter-btn active" data-value="100" onclick="setUnloadedCardsPageSize(100)" type="button">100</button>
              <button class="pill-filter-btn" data-value="200" onclick="setUnloadedCardsPageSize(200)" type="button">200</button>
            </div>
            <button class="missing-refresh-btn" onclick="queryUnloadedCards()" title="Refresh" type="button">
              <i class="redo icon"></i>
            </button>
          </div>
        </div>
        <section>
          <div id="unloaded-cards-list">
            <div class="missing-loading-state">
              <i class="spinner loading icon"></i>
              Loading…
            </div>
          </div>
          <div id="unloaded-pagination" class="ui centered pagination menu"></div>
        </section>
      </div>

    </div>
  </div>
</body>
</html>
